    <h2> แบบฟอร์มเลือกความสนใจ </h2>
    <div id="content">
    </div>
   <input type="checkbox" name="interest" value="กีฬา">กีฬา
   <input type="checkbox" name="interest" value="ดนตรี">ดนตรี
   <input type="checkbox" name="interest" value="อ่านหนังสือ">อ่านหนังสือ
   <br><br>
   <button onclick="submitInterest()">ส่งข้อมูล</button>
    <script>
       function submitInterest() {
        //ดึงข้อมูลจาก checkbox ที่ถูกเลือก
        let checkbox = document.querySelectorAll('input[name=interest]');
        let contentHTML = '<ul>';
        //เอา value ของ checkbox ที่ถูกเลือกออกมา
        for (let i = 0; i < checkbox.length; i++){
            if (checkbox[i].checked) {
                //console.log(checkbox[i].value); //แสดงต่าที่เลิอกใน console
                contentHTML += '<li>' +checkbox[i].value + '</li>';
            }
        }
        //วนค่าที่เลือกใส่กลับไปที่ html
        contentHTML += '</ul>';

        //ใส่html ที่สร้างขึ้นใหม่ลงใน div id="content"
        let contentDIV = document.getElementById('content');
        contentDIV.innerHTML + contentHTML;
       }
